name: CI

# Runs on every PR (so tests gate merges) and on pushes to the deploy branches.
on:
  pull_request:
  push:
    branches: [main, staging]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax-check server entry
        run: node --check server/index.js
      - name: Unit tests
        run: npm test
