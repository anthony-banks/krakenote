name: test

# Backend unit tests (node:test). Fast, no network/DB — runs on every PR + push.
on:
  pull_request:
  push:
    branches: [main, staging]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
