<!--
  Krakenote — "Confirm signup" email template.

  Paste this into Supabase → Authentication → Email Templates → "Confirm signup"
  (for BOTH the staging and prod projects). Fixes KRA-63: some webmail clients
  (e.g. Yahoo in a browser) don't auto-linkify a bare confirmation URL, leaving
  users with an unclickable link. This renders a real button AND a copy-paste
  fallback link. Uses table-based button + inline styles for email-client compat.

  Supabase variables available here: {{ .ConfirmationURL }}, {{ .Email }}, etc.
-->
<div style="font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;max-width:480px;margin:0 auto;padding:24px;color:#1a2233">
  <h1 style="font-size:20px;margin:0 0 8px;color:#1a2233">Confirm your email</h1>
  <p style="font-size:15px;line-height:1.5;margin:0 0 22px;color:#4a5568">
    Thanks for signing up for Krakenote! Tap the button below to activate your account.
  </p>

  <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 22px">
    <tr>
      <td align="center" style="border-radius:10px;background:#6c63ff">
        <a href="{{ .ConfirmationURL }}" target="_blank"
           style="display:inline-block;padding:13px 28px;font-size:16px;font-weight:600;line-height:1;color:#ffffff;text-decoration:none;border-radius:10px">
          Confirm my email
        </a>
      </td>
    </tr>
  </table>

  <p style="font-size:13px;line-height:1.5;color:#718096;margin:0 0 6px">
    If the button doesn't work, copy and paste this link into your browser:
  </p>
  <p style="font-size:13px;line-height:1.5;word-break:break-all;margin:0 0 24px">
    <a href="{{ .ConfirmationURL }}" target="_blank" style="color:#6c63ff">{{ .ConfirmationURL }}</a>
  </p>

  <p style="font-size:12px;line-height:1.5;color:#a0aec0;margin:0">
    If you didn't create a Krakenote account, you can safely ignore this email.
  </p>
</div>
